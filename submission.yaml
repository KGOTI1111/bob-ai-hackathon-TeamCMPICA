submission:
  title: "Supply Chain Disruption Assistant & Fleet
Utilisation Optimizer"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: Global supply chains struggle with unmonitored route disruptions, inefficient fleet asset allocation, and delayed detection of cold-chain temperature breaches that cause massive cargo losses. >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Replace this text with a concise description of the real-world problem
    your project addresses and who experiences it.

  solution_summary: The Supply Chain Optimizer is a predictive, real-time logistics monitoring and mitigation platform designed to safeguard high-value, temperature-sensitive shipments from disruptions and cargo loss. >                  # REQUIRED — 1-3 sentences. What did you build?
    Replace this text with a clear description of your solution
    and how it addresses the problem above.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Real-Time Cold-Chain Surveillance"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Automated Disruption Mitigation"
    - "Fleet Asset Optimization"
    - "End-to-End Shipment Tracking"                               # optional 4th
    - "Interactive Operations Dashboard"                               # optional 5th

  tech_stack:
    languages: [Python, JavaScript, SQL, HTML, CSS]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: [FastAPI / Flask (Python WSGI/ASGI backend stack)]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: [IBM Cloud Ready, watsonx.ai Integration Ready, BOB]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: [PostgreSQL / SQLite]                      # e.g., ["PostgreSQL", "Redis"]
    other: [RESTful APIs, Python Virtual Environments (venv), Python-dotenv]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: Building a fully integrated, end-to-end logistics monitoring platform from the ground up that bridges real-time physical telemetry with proactive risk mitigation. We are especially proud of our specialized cold-chain thermal surveillance module (cold_chain.py), which moves logistics tracking from reactive reporting to proactive prevention—safeguarding high-value cargo before spoilage occurs. Additionally, designing a clean, modular backend architecture using Python FastAPI alongside a responsive, zero-dependency frontend dashboard allows operators to track asset states and route disruptions seamlessly within a single pane of glass>         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: While our prototype effectively handles real-time route monitoring and cold-chain anomaly detection, it currently operates on simulated IoT telemetry and static route datasets (sample_data.sql) rather than direct live satellite or vessel-tracking APIs. The current disruption mitigation engine relies on threshold-based logic, which requires further training against larger historical supply-chain datasets in IBM watsonx.ai to improve multi-hop predictive accuracy. Furthermore, authentication and role-based access control (RBAC) are not yet implemented at the API boundary, meaning all connected operators share a unified view without fine-grained enterprise permissioning. >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

